server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info
# Boot 4 turns the liveness/readiness probe groups on by default; /actuator/health stays as it was.
management.endpoint.health.probes.enabled=false

# Hand-written OpenAPI at /openapi.yaml; Swagger UI loads that file.
# Keep api-docs enabled so springdoc serves the UI (needed even with a custom url).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true

# Kept from the 2019 setup, the mobile client depends on some of these
# (Boot 4 names: server.error.* is spring.web.error.*, server.servlet.encoding.* is spring.servlet.encoding.*,
# spring.jackson.parser.* is spring.jackson.json.read.*)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.servlet.encoding.force=true
spring.jackson.json.read.allow-java-comments=true

# Jackson 3 sorts properties alphabetically by default; keep the declaration order the API has always had.
spring.jackson.mapper.sort-properties-alphabetically=false

