server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info

# Hand-written OpenAPI at /openapi.yaml; Swagger UI loads that file.
# Keep api-docs enabled so springdoc 1.7 serves the UI (needed even with a custom url).
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true

# Kept from the 2019 setup, the mobile client depends on some of these
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.encoding.force=true
spring.jackson.parser.allow-comments=true

#logging.level.org.springframework.jdbc.core=DEBUG
