openapi: 3.0.3
info:
  title: CFP API
  description: |
    Conference call-for-papers backend. Speakers register, submit talks, and
    reviewers rate them. Specs for the base features live on the fagdag harness;
    this document mirrors the implemented HTTP API for local exploration.
  version: 1.5.0
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: health
  - name: speakers
  - name: talks
  - name: ratings
  - name: co-speakers
  - name: acceptance
  - name: workshops
  - name: programme
  - name: admin
    description: Internal/admin helpers; not part of the public harness specs
paths:
  /health:
    get:
      tags: [health]
      summary: Deploy health probe
      description: |
        200 when the database answers within 5 s, otherwise 503.
        `version` is the baked-in `GIT_SHA` (or `dev` locally).
      operationId: getHealth
      responses:
        '200':
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: dev
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: db-unavailable
                version: dev

  /speakers:
    post:
      tags: [speakers]
      summary: Register a speaker
      operationId: createSpeaker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSpeaker'
            example:
              name: Ada Lovelace
              email: ada@example.com
              bio: Wrote the first program.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speaker'

  /speakers/{id}:
    get:
      tags: [speakers]
      summary: Get a speaker
      operationId: getSpeaker
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speaker'
        '404':
          description: Not found
    put:
      tags: [admin]
      summary: Update a speaker (admin typo fix)
      operationId: updateSpeaker
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                bio: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speaker'

  /speakers/{id}/talks:
    get:
      tags: [talks]
      summary: List talks for a speaker (main speaker only)
      operationId: listTalksForSpeaker
      parameters:
        - $ref: '#/components/parameters/SpeakerId'
      responses:
        '200':
          description: Oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Talk'

  /speakers/search:
    get:
      tags: [admin]
      summary: Search speakers
      operationId: searchSpeakers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Speaker'

  /talks:
    get:
      tags: [talks]
      summary: List talks
      description: |
        Default order is oldest first. `sort=rating` ranks by average rating
        (desc), then rating count, then oldest; unrated talks last.
      operationId: listTalks
      parameters:
        - name: speakerId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only this speaker's talks (main speaker)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [rating]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Talk'
    post:
      tags: [talks]
      summary: Submit a talk
      description: At most 3 talks per speaker. Duration is derived from format.
      operationId: submitTalk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTalk'
            example:
              title: Hello, world
              format: PRESENTATION
              level: BEGINNER
              speakerId: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'

  /talks/{id}:
    get:
      tags: [talks]
      summary: Get a talk
      operationId: getTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          description: Not found

  /talks/{id}/ratings/{reviewerId}:
    put:
      tags: [ratings]
      summary: Rate a talk (create or replace)
      operationId: rateTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
        - name: reviewerId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          description: Positive whole number; reviewers are not registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
            example:
              score: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

  /talks/{id}/co-speakers/{speakerId}:
    parameters:
      - $ref: '#/components/parameters/TalkId'
      - name: speakerId
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: A registered speaker
    put:
      tags: [co-speakers]
      summary: Add a co-speaker
      description: |
        Appends the speaker to the talk's co-speakers. At most two, and never the
        talk's main speaker. Adding someone who is already a co-speaker changes nothing.
        Co-speaking doesn't count towards the speaker's limit of 3 talks.
      operationId: addCoSpeaker
      responses:
        '200':
          description: The talk, with the co-speaker added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          description: The speaker is the talk's main speaker
        '404':
          description: Talk or speaker not found
        '409':
          description: The talk already has two co-speakers
    delete:
      tags: [co-speakers]
      summary: Remove a co-speaker
      description: Removing a speaker who isn't a co-speaker of the talk (also removing one twice) is 404 and changes nothing.
      operationId: removeCoSpeaker
      responses:
        '200':
          description: The talk, without the co-speaker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '404':
          description: Talk or speaker not found, or the speaker isn't a co-speaker of the talk

  /talks/{id}/status:
    put:
      tags: [acceptance]
      summary: Accept, reject or waitlist a talk
      description: |
        From SUBMITTED or WAITLISTED. ACCEPTED and REJECTED are final: any decision on them,
        the same one included, is 409. Waitlisting a waitlisted talk is 409 too. Accepting
        needs ratings from at least two different reviewers.
      operationId: decideTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
            example:
              status: ACCEPTED
      responses:
        '200':
          description: The talk, with its new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          description: Body missing or not JSON, or status isn't ACCEPTED, REJECTED or WAITLISTED
        '404':
          description: Talk not found
        '409':
          description: Not allowed from the talk's current status, or fewer than two reviewers for ACCEPTED

  /talks/{id}/withdraw:
    post:
      tags: [acceptance]
      summary: Withdraw a talk (its main speaker only)
      description: From SUBMITTED, WAITLISTED or ACCEPTED. WITHDRAWN is final.
      operationId: withdrawTalk
      parameters:
        - $ref: '#/components/parameters/TalkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Withdrawal'
            example:
              speakerId: 1
      responses:
        '200':
          description: The talk, now WITHDRAWN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Talk'
        '400':
          description: Body missing or not JSON, or speakerId isn't a whole number
        '403':
          description: speakerId isn't the talk's main speaker (co-speakers and unknown ids included)
        '404':
          description: Talk not found
        '409':
          description: The talk is REJECTED or already WITHDRAWN

  /workshops/{id}/registrations:
    parameters:
      - name: id
        in: path
        required: true
        description: The workshop's talk id
        schema: { type: integer, format: int64 }
    post:
      tags: [workshops]
      summary: Register for an accepted workshop
      description: |
        Only talks with format WORKSHOP and status ACCEPTED take registrations. At most 20 per
        workshop, and one per email (compared case-insensitively, surrounding spaces ignored).
        name and email are stored and returned as sent.
      operationId: registerForWorkshop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              name: Ada
              email: ADA@Example.com
      responses:
        '201':
          description: The registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
        '400':
          description: Id not an integer, body missing or not a JSON object, name or email missing or blank, or email not an email
        '404':
          description: No such talk
        '409':
          description: The talk isn't a workshop, the workshop isn't ACCEPTED, the email is already registered for it, or it has 20 registrations
    get:
      tags: [workshops]
      summary: A workshop's registrations, first registered first
      description: Whatever the workshop's status; a withdrawn workshop keeps its list. A talk that isn't a workshop has an empty list.
      operationId: listWorkshopRegistrations
      responses:
        '200':
          description: The registrations; [] when none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registration'
        '400':
          description: Id not an integer
        '404':
          description: No such talk

  /programme/{room}/{slot}:
    parameters:
      - name: room
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Room' }
      - name: slot
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Slot' }
    put:
      tags: [programme]
      summary: Place an accepted talk in a room and slot
      description: |
        Only ACCEPTED talks. Workshops fit S4 only. One talk per cell; a talk appears
        at most once. Speakers and co-speakers must not clash in the same slot across rooms.
        Re-PUT of the same talk into the same cell is 200 (idempotent).
      operationId: scheduleTalk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scheduling'
            example:
              talkId: 42
      responses:
        '200':
          description: The programme entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          description: Body missing or not JSON, talkId isn't a whole number, or no talk has that id
        '404':
          description: Unknown room/slot
        '409':
          description: Not ACCEPTED, workshop in a short slot, cell occupied, talk already placed, or speaker clash
    get:
      tags: [programme]
      summary: Look up what is in a room and slot
      operationId: getProgrammeEntry
      responses:
        '200':
          description: The programme entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '404':
          description: Unknown room/slot, or the cell is empty
    delete:
      tags: [programme]
      summary: Take the talk out of this room and slot
      description: The talk may be placed elsewhere afterwards.
      operationId: unscheduleTalk
      responses:
        '204':
          description: The talk was taken out; no body
        '404':
          description: Unknown room/slot, or the cell is empty

  /admin/stats:
    get:
      tags: [admin]
      summary: Aggregate statistics
      operationId: adminStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/talks.csv:
    get:
      tags: [admin]
      summary: Export talks as CSV
      operationId: adminTalksCsv
      responses:
        '200':
          description: CSV attachment
          content:
            text/csv:
              schema: { type: string }

components:
  parameters:
    SpeakerId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TalkId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, db-unavailable]
        version:
          type: string

    NewSpeaker:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }
        bio:
          type: string
          nullable: true
          maxLength: 500

    Speaker:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        bio: { type: string, nullable: true }

    Format:
      type: string
      enum: [LIGHTNING_10, LIGHTNING_20, PRESENTATION, WORKSHOP]

    Level:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    NewTalk:
      type: object
      required: [title, format, level, speakerId]
      properties:
        title: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        level: { $ref: '#/components/schemas/Level' }
        speakerId: { type: integer, format: int64 }

    Status:
      type: string
      enum: [SUBMITTED, ACCEPTED, REJECTED, WAITLISTED, WITHDRAWN]

    Decision:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED, WAITLISTED]

    Withdrawal:
      type: object
      required: [speakerId]
      properties:
        speakerId:
          type: integer
          format: int64
          description: The speaker asking to withdraw; must be the talk's main speaker

    Talk:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        level: { $ref: '#/components/schemas/Level' }
        speakerId: { type: integer, format: int64 }
        durationMinutes: { type: integer }
        status: { $ref: '#/components/schemas/Status' }
        submittedAt:
          type: string
          description: UTC instant, e.g. 2026-11-04T12:30:05.123+00:00
          example: '2026-11-04T12:30:05.123+00:00'
        submittedOn:
          type: string
          format: date
          example: '2026-11-04'
        averageRating:
          type: number
          nullable: true
          description: Rounded to one decimal; null when unrated
        ratingCount: { type: integer }
        coSpeakerIds:
          type: array
          items: { type: integer, format: int64 }
          description: The co-speakers' speaker ids, in the order they were added; [] when none

    RegistrationRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }

    Registration:
      type: object
      properties:
        id: { type: integer, format: int64 }
        workshopId: { type: integer, format: int64, description: The workshop's talk id }
        name: { type: string }
        email: { type: string, description: As the attendee typed it }

    Rating:
      type: object
      properties:
        talkId: { type: integer, format: int64 }
        reviewerId: { type: integer, format: int64 }
        score: { type: integer, minimum: 1, maximum: 5 }
        ratedAtDisplay:
          type: string
          description: US short time in UTC, e.g. 11/4/26, 1:05 PM
          example: '11/4/26, 1:05 PM'

    Room:
      type: string
      enum: [R1, R2, R3]

    Slot:
      type: string
      enum: [S1, S2, S3, S4, S5]

    Scheduling:
      type: object
      required: [talkId]
      properties:
        talkId: { type: integer, format: int64 }

    Entry:
      type: object
      required: [room, slot, start, end, talkId]
      properties:
        room: { $ref: '#/components/schemas/Room' }
        slot: { $ref: '#/components/schemas/Slot' }
        start:
          type: string
          description: Fixed start time for the slot, HH:mm
          example: '13:30'
        end:
          type: string
          description: Fixed end time for the slot, HH:mm
          example: '15:30'
        talkId: { type: integer, format: int64 }
