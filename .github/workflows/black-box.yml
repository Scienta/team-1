# Black-box Vitest suite against a job-local Postgres + jar.
# Mark this check required in branch protection; it is not wired into deploy.yml.
#
# Runs on: every pull_request, workflow_dispatch, and direct pushes to main.
# Skips push-to-main when the commit is associated with a merged PR (already tested on the PR).
name: black-box

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decide whether to run the suite (avoids starting Postgres for skipped merges).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "Event ${{ github.event_name }}: run black-box"
            exit 0
          fi
          # Push to main: skip if this commit was introduced by a PR (merge/squash/rebase).
          # Direct pushes typically have no associated PR.
          # https://docs.github.com/en/rest/commits/commits#list-pull-requests-associated-with-a-commit
          count="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq 'length')"
          if [ "$count" != "0" ]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "Commit ${{ github.sha }} is associated with a PR — skip black-box on push (covered by PR run)."
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
            echo "Direct push to main — run black-box."
          fi

  black-box:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cfp
          POSTGRES_USER: cfp
          POSTGRES_PASSWORD: cfp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfp -d cfp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: cfp
      PGUSER: cfp
      PGPASSWORD: cfp
      PGSSLMODE: disable
      GIT_SHA: ${{ github.sha }}
      CFP_BASE_URL: http://localhost:8080
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: black-box-tests/package-lock.json

      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - name: Install black-box deps
        working-directory: black-box-tests
        run: npm ci

      - name: Start app
        run: |
          set -euo pipefail
          java -jar target/cfp.jar > /tmp/cfp.log 2>&1 &
          echo $! > /tmp/cfp.pid
          for i in $(seq 1 60); do
            body="$(curl -sS --max-time 2 "$CFP_BASE_URL/health" || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "healthy: $body"
              exit 0
            fi
            sleep 1
          done
          echo "=== cfp.log ==="
          cat /tmp/cfp.log || true
          exit 1

      - name: Run black-box tests
        working-directory: black-box-tests
        run: npm run test:ci

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/cfp.pid ]; then
            kill "$(cat /tmp/cfp.pid)" || true
          fi
