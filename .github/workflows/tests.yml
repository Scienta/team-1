# Java build and tests on pull requests. The Vitest suite stays in black-box.yml.
# A PR is ready only when this check and black-box are both green.
name: tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Cache ~/.m2
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: m2-
      - name: Build and test
        run: ./mvnw -B package
